; Matches the values seen on the current Pantheon environment
; (Tools -> Site Health -> Info, captured 2026-09-28), so behavior around
; large uploads and heavy admin screens doesn't change with the move.
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_input_vars = 10000
max_input_time = 900
max_execution_time = 120
opcache.enable = 1
; Errors go to the log, never into the response body (the REST API returns JSON).
display_errors = Off
log_errors = On
